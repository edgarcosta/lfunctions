    kind: ec
    curve: "[0,-1,1,-10,-20]"
    sym: 1
    conductor: 11
    bad_factors:
      11: [1, -1]            # split multiplicative, a_11 = +1
    expected:
      rank: 0
      epsilon: [1.0, 0.0]
      first_zero: "6.36261389471308870139"
      first_zero_err: 1.0e-15
      taylor: "0.25384186085591068433775892335043887465"
      taylor_err: 1.0e-12
      tolerate_rh_error: false

