    sym: 1
    conductor: 294
    bad_factors:            # 2,3,7 bad (p=2 supplied here, so no force_factors needed)
      2: [1, 2, 3, 2]
      3: [1, 1, 1, -3]
      7: [1, 0, -1]
    expected:
