# High-degree certified regression objects (bead lfunctions-8dz), conforming to
# INTERFACES.md section A. Objects, ranks, root numbers, and bad Euler factors come
# from the LMFDB (https://www.lmfdb.org): elliptic-curve leading L-values from
# ec_mwbsd.special_value and bad reduction types from ec_localdata; genus-2 eqn /
# analytic_rank / root_number / leading_coeff / bad_lfactors from g2c_curves; degree-2
# first zeros from lfunc_search.z1. Symmetric-power data (Sym^2,4,5,6,7,8 of 11.a) and
# the rank-5 curve 19047851.a1 (absent from lfunc_search) were computed with Pari/GP via
# Sage 10.8 (lfunsympow / lfuncreate, lfunorderzero, lfunzeros, lfunrootres/ellrootno).
# Bad factors are stored already-Sym^k'd, ascending; the driver injects them verbatim.

objects:
  # ---- (1) Six elliptic curves, ranks 0-5 (degree 2) ----
