name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libflint-dev libprimesieve-dev
      - name: Configure
        run: ./configure
      - name: Build
        run: make
      - name: Test
        run: make check
